name: GHCR CI Build

# 开发/提交驱动的 CI 镜像构建：每次运行把版本号改为
#   <当前版本号>.<构建号>
# 其中「当前版本号」取自 backend/cmd/server/VERSION（如 0.1.179），
# 「构建号」为本次 workflow 运行号 github.run_number（第 1 次运行即 0.1.179.1）。
# 打包前会更新检出目录中的 VERSION 文件，并通过 Dockerfile ARG VERSION 注入 main.Version；
# 该临时改动仅参与本次构建，不回写仓库。
# 镜像发布到 GitHub Container Registry (ghcr.io)。

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_number:
        description: '构建号（覆盖 github.run_number，如 1 得到 0.1.179.1）'
        required: false
        type: string
      moving_tag:
        description: '移动标签（latest 会与 release 流水线冲突，默认 nightly）'
        required: false
        default: 'nightly'
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: sub2api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update version (current.<build-number>)
        id: version
        env:
          INPUT_BUILD_NUMBER: ${{ github.event.inputs.build_number }}
          INPUT_MOVING_TAG: ${{ github.event.inputs.moving_tag }}
        run: |
          BASE=$(tr -d '[:space:]' < backend/cmd/server/VERSION)
          BUILD=${INPUT_BUILD_NUMBER:-${{ github.run_number }}}
          MOVING=${INPUT_MOVING_TAG:-nightly}

          if ! printf '%s' "$BASE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::backend/cmd/server/VERSION must be x.y.z, got: ${BASE}"
            exit 1
          fi
          if ! printf '%s' "$BUILD" | grep -Eq '^[0-9]+$'; then
            echo "::error::build number must contain digits only, got: ${BUILD}"
            exit 1
          fi
          if ! printf '%s' "$MOVING" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
            echo "::error::invalid Docker moving tag: ${MOVING}"
            exit 1
          fi

          VERSION="${BASE}.${BUILD}"
          OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # 打包前真实更新版本文件；Docker build 同时通过 ARG VERSION 注入二进制。
          printf '%s\n' "$VERSION" > backend/cmd/server/VERSION

          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "owner_lc=${OWNER_LC}" >> "$GITHUB_OUTPUT"
          echo "moving=${MOVING}" >> "$GITHUB_OUTPUT"
          echo "date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          echo "Version file updated: ${BASE} -> ${VERSION}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # 构建前把版本号改为 <当前版本号>.<构建号>（注入 main.Version）
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.version.outputs.date }}
          tags: |
            ghcr.io/${{ steps.version.outputs.owner_lc }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.version.outputs.owner_lc }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.moving }}
            ghcr.io/${{ steps.version.outputs.owner_lc }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## GHCR CI 构建完成" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 版本号: \`${{ steps.version.outputs.version }}\`（基础 \`${{ steps.version.outputs.base }}\` + 构建号 \`${{ steps.version.outputs.build }}\`）" >> "$GITHUB_STEP_SUMMARY"
          echo "- 镜像:" >> "$GITHUB_STEP_SUMMARY"
          echo "  - \`ghcr.io/${{ steps.version.outputs.owner_lc }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "  - \`ghcr.io/${{ steps.version.outputs.owner_lc }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.moving }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "  - \`ghcr.io/${{ steps.version.outputs.owner_lc }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
